<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Srivipassi · Dhamma School, Kananwila</title>
<meta name="description" content="Dhamma School, Kananwila. Official website launch, opening the door for our students to work and learn in the digital world.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --black: #030303;
    --gold: #d9a441;
    --pale: #efe3c8;
    --dim: #8a7d63;
    --soft: #b9aa8a;
    --faint: #4a4132;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
    --dockh: 20rem;
    --d: max(200px, min(calc(100vh - var(--dockh)), 94vw, 780px)); /* diameter of the wheel */
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    color: var(--pale);
    background: var(--black);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #embers { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- The world around the wheel ---------- */
  .horizon {
    position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(150, 56, 24, .34), rgba(90, 30, 12, .12) 55%, transparent 80%);
  }
  .floaters { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .mist { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* beams of light, as if through a temple window; they sway very slowly */
  .beams { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .beams i {
    position: absolute; top: -12vh; left: var(--l); width: var(--w); height: 130vh; transform-origin: 50% 0;
    background: linear-gradient(to bottom, rgba(255, 226, 150, .17), rgba(255, 200, 110, .05) 55%, transparent 85%);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 35%, #000 65%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 35%, #000 65%, transparent);
    filter: blur(10px); transform: rotate(var(--a)); animation: beam var(--d) ease-in-out infinite alternate;
  }
  @keyframes beam {
    from { transform: rotate(calc(var(--a) - 4deg)); opacity: .45; }
    to   { transform: rotate(calc(var(--a) + 4deg)); opacity: 1; }
  }

  /* slow rings of light that leave the centre of the wheel, once per breath */
  .halo {
    position: absolute; left: 50%; top: 50%; width: 8%; aspect-ratio: 1; margin: -4% 0 0 -4%;
    border: 1px solid rgba(255, 226, 150, .55); border-radius: 50%; opacity: 0; pointer-events: none;
    animation: halo 10s ease-out infinite;
  }
  @keyframes halo { 0% { transform: scale(1); opacity: 0; } 8% { opacity: .55; } 100% { transform: scale(13); opacity: 0; } }

  /* little stars of light that flash on the name */
  .spark { position: absolute; z-index: 2; pointer-events: none; filter: drop-shadow(0 0 6px rgba(255, 220, 140, .95)); animation: spark 1.4s ease-in-out forwards; }
  .spark i { display: block; width: 100%; height: 100%; background: #fff6dc;
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }
  @keyframes spark { 0% { transform: scale(0) rotate(0); opacity: 0; } 40% { transform: scale(1) rotate(45deg); opacity: 1; } 100% { transform: scale(0) rotate(90deg); opacity: 0; } }

  /* things that hang in the air and bob very gently */
  .fl {
    position: absolute; opacity: 0;
    animation: appear 3.5s ease var(--in, 0s) forwards;
    will-change: transform;
  }
  .fl svg { display: block; width: 100%; height: auto; overflow: visible; }
  @keyframes appear { to { opacity: var(--o, .7); } }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(var(--r0, -1.2deg)); }
    50%      { transform: translateY(var(--dy, -12px)) rotate(var(--r1, 1.2deg)); }
  }
  .stupa, .temple { filter: drop-shadow(0 0 12px rgba(217, 164, 65, .38)); }
  .moon { filter: drop-shadow(0 0 16px rgba(255, 240, 200, .55)) drop-shadow(0 0 60px rgba(255, 220, 150, .3)); }
  .dhamma { animation: spin 90s linear infinite; filter: drop-shadow(0 0 8px rgba(217, 164, 65, .45)); }
  .lotus-fl { filter: drop-shadow(0 0 10px rgba(255, 126, 182, .45)); }
  .gadget { filter: drop-shadow(0 0 10px rgba(217, 164, 65, .4)); }
  .glyph { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--gold);
    text-shadow: 0 0 14px rgba(217, 164, 65, .6); letter-spacing: .1em; white-space: nowrap; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 2.4s ease-in-out infinite; filter: drop-shadow(0 0 6px #ffb347); }
  @keyframes flicker {
    0%, 100% { transform: scale(1, 1) skewX(0); }
    25%      { transform: scale(.94, 1.07) skewX(2.5deg); }
    50%      { transform: scale(1.06, .94) skewX(-2.5deg); }
    75%      { transform: scale(.97, 1.04) skewX(1.2deg); }
  }

  /* Bodhi leaves falling, Vesak lanterns rising */
  .leaf { position: absolute; top: 0; width: var(--s); opacity: .6; animation: fall var(--t) linear var(--del) infinite; }
  .leaf svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 6px rgba(244, 193, 79, .35));
    animation: sway var(--sw) ease-in-out var(--del) infinite alternate; }
  @keyframes fall { from { transform: translateY(-14vh); } to { transform: translateY(114vh); } }
  @keyframes sway { from { transform: translateX(-30px) rotate(-30deg); } to { transform: translateX(30px) rotate(30deg); } }

  .lantern { position: absolute; bottom: 0; width: var(--s); height: calc(var(--s) * 1.3); opacity: 0; animation: lift var(--t) linear var(--del) infinite; }
  .lantern i {
    display: block; position: relative; width: 100%; height: 100%;
    border-radius: 46% 46% 40% 40% / 38% 38% 62% 62%;
    background: radial-gradient(circle at 50% 75%, #fff4c8 0%, #ffbe55 38%, #e0612a 100%);
    box-shadow: 0 0 16px 5px rgba(255, 160, 60, .5);
    animation: sway2 7s ease-in-out infinite alternate;
  }
  .lantern i::before, .lantern i::after { content: ""; position: absolute; left: 18%; right: 18%; height: 3px; background: #8a5a1c; border-radius: 2px; }
  .lantern i::before { top: -3px; }
  .lantern i::after  { bottom: -3px; }
  @keyframes lift { 0% { transform: translateY(12vh); opacity: 0; } 10% { opacity: .85; } 85% { opacity: .7; } 100% { transform: translateY(-118vh); opacity: 0; } }
  @keyframes sway2 { from { transform: translateX(-14px) rotate(-5deg); } to { transform: translateX(14px) rotate(5deg); } }

  /* ---------- Layout ---------- */
  .scene { position: relative; z-index: 2; height: 100%; text-align: center; }

  /* ---------- The wheel: saṃsāra turning around a still centre, nibbāna ---------- */
  .ring {
    position: absolute; left: 50%; top: calc(var(--d) / 2 + 4vh); translate: -50% -50%;
    width: var(--d); height: var(--d);
    animation: ringbreath 10s ease-in-out infinite;
  }
  @keyframes ringbreath { 0%, 100% { transform: scale(.985); } 40% { transform: scale(1.02); } }

  /* The aura: light that rises from the middle and breathes */
  .aura {
    position: absolute; left: 50%; top: 50%; width: 175%; aspect-ratio: 1; translate: -50% -50%;
    transition: scale 4s ease, filter 1.8s ease; pointer-events: none;
  }
  .aura span {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 252, 238, .95) 0%, rgba(255, 228, 150, .7) 5%, rgba(246, 182, 74, .38) 14%,
      rgba(220, 124, 42, .17) 28%, rgba(130, 44, 22, .07) 44%, transparent 60%);
    animation: aurabreath 10s ease-in-out infinite;
  }
  @keyframes aurabreath {
    0%, 100% { transform: scale(.86); opacity: .65; }
    40%      { transform: scale(1.08); opacity: 1; }
  }
  .ring.center-lit .aura { filter: brightness(1.45); }

  .rays {
    position: absolute; left: 50%; top: 50%; width: 175%; aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(rgba(255, 226, 150, .09) 0deg 1.4deg, transparent 1.4deg 11deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 58%);
            mask-image: radial-gradient(circle, #000 0%, transparent 58%);
    animation: spin 120s linear infinite;
  }

  /* The centre does not turn */
  .core {
    position: absolute; left: 50%; top: 50%; width: calc(var(--d) * .036); aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%; background: #fffaf0;
    box-shadow: 0 0 10px 4px rgba(255, 244, 210, .95), 0 0 36px 14px rgba(255, 205, 105, .6), 0 0 90px 36px rgba(255, 150, 50, .32);
    transition: scale 4s ease; animation: corebreath 10s ease-in-out infinite; pointer-events: none;
  }
  @keyframes corebreath { 0%, 100% { opacity: .8; } 40% { opacity: 1; } }

  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .orb { opacity: .5; transition: opacity 1.6s ease; }
  .orb.lit { opacity: 1; }

  /* Each key you press sends one soft wave from the centre */
  .pulse {
    position: absolute; left: 50%; top: 50%; width: 6%; aspect-ratio: 1; margin: -3% 0 0 -3%;
    border: 1px solid var(--gold); border-radius: 50%; opacity: 0; pointer-events: none;
    animation: pulse 2.6s ease-out forwards;
  }
  @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(14); opacity: 0; } }

  /* ---------- Words and the gate, resting at the bottom ---------- */
  .dock {
    position: absolute; left: 0; right: 0; bottom: 0; isolation: isolate;
    display: flex; flex-direction: column; align-items: center; gap: clamp(.6rem, 2vh, 1.3rem);
    padding: 0 1.25rem max(3.6rem, env(safe-area-inset-bottom));
  }
  .dock::before {
    content: ""; position: absolute; z-index: -1; left: 0; right: 0; bottom: 0; top: -3rem; pointer-events: none;
    background: radial-gradient(ellipse 58% 68% at 50% 58%, rgba(3, 3, 3, .86) 0%, rgba(3, 3, 3, .62) 50%, transparent 82%);
  }
  h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(1.8rem, min(5.6vw, 8.2vh), 4rem);
    letter-spacing: .34em; padding-left: .34em; text-transform: uppercase;
    color: #fff7e3;
    text-shadow: 0 0 18px rgba(0, 0, 0, .95), 0 0 34px rgba(217, 164, 65, .4);
    animation: titleglow 6s ease-in-out 3s infinite;
  }
  @keyframes titleglow {
    0%, 100% { text-shadow: 0 0 18px rgba(0, 0, 0, .95), 0 0 30px rgba(217, 164, 65, .3); }
    50%      { text-shadow: 0 0 18px rgba(0, 0, 0, .95), 0 0 52px rgba(217, 164, 65, .75); }
  }
  /* each letter rises out of the dark, then moves in a slow wave */
  .ch { display: inline-block; opacity: 0;
    animation: chin 1.5s ease forwards, wave 7s ease-in-out infinite, lit 8s ease-in-out infinite;
    animation-delay: calc(1.3s + var(--i) * .1s), calc(3.4s + var(--i) * .14s), calc(4.2s + var(--i) * .2s); }
  /* looped: a golden light runs through the letters one by one, rests, then runs through again */
  @keyframes lit {
    0%, 24%, 100% { color: #fff7e3; }
    10% { color: #ffd77a; text-shadow: 0 0 20px rgba(255, 200, 90, .95), 0 0 42px rgba(255, 170, 60, .6); }
  }
  @keyframes chin { from { opacity: 0; transform: translateY(22px); filter: blur(9px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* the school and the launch statement, word by word */
  .kicker {
    display: flex; align-items: center; justify-content: center; gap: 1rem;
    font-family: var(--sans); font-weight: 500; font-size: clamp(.72rem, 1.6vw, .98rem);
    letter-spacing: .42em; text-transform: uppercase; color: #f4c14f;
    text-shadow: 0 0 14px rgba(0, 0, 0, .95);
  }
  .kicker i { display: block; height: 1px; width: clamp(28px, 8vw, 96px); }
  .kicker i:first-child { background: linear-gradient(90deg, transparent, var(--gold)); transform-origin: right; animation: grow 1.8s ease .5s both; }
  .kicker i:last-child  { background: linear-gradient(270deg, transparent, var(--gold)); transform-origin: left;  animation: grow 1.8s ease .5s both; }
  @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
  /* the launch line sits in a glowing gold capsule with a light that sweeps across it */
  .launch {
    position: relative; overflow: hidden; display: inline-block;
    padding: .55rem 1.5rem; border: 1px solid rgba(244, 193, 79, .65); border-radius: 999px;
    background: rgba(24, 12, 3, .6);
    box-shadow: 0 0 26px rgba(217, 164, 65, .32), inset 0 0 16px rgba(217, 164, 65, .14);
    font-family: var(--serif); font-weight: 600; font-size: clamp(.9rem, min(1.9vw, 2.8vh), 1.25rem);
    letter-spacing: .3em; text-transform: uppercase; color: #fff3d0;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 0 14px rgba(217, 164, 65, .55);
  }
  .launch::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255, 240, 200, .38), transparent);
    animation: sweep 5s ease-in-out 5s infinite;
  }
  @keyframes sweep { 0% { left: -60%; } 35%, 100% { left: 130%; } }
  .lede {
    font-family: var(--serif); font-style: italic; font-weight: 500;
    font-size: clamp(1.05rem, min(2.5vw, 3.5vh), 1.75rem); line-height: 1.35; color: #fff6e0; max-width: 36ch;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .95), 0 0 16px rgba(0, 0, 0, .95);
  }
  .hl { color: #ffd77a; text-shadow: 0 1px 2px rgba(0, 0, 0, .95), 0 0 20px rgba(255, 190, 80, .65); }
  .w { display: inline-block; opacity: 0; animation: win 1.3s ease forwards; animation-delay: calc(var(--d0, 0s) + var(--i) * .13s); }
  @keyframes win { from { opacity: 0; transform: translateY(12px); filter: blur(7px); } to { opacity: 1; transform: none; filter: none; } }
  .contemplate {
    min-height: 1.6em; font-family: var(--serif); font-style: italic; font-weight: 300;
    font-size: clamp(1.2rem, 2.8vw, 1.7rem); letter-spacing: .08em; color: var(--soft);
    text-shadow: 0 0 14px rgba(0, 0, 0, .95);
    transition: opacity 1.7s ease, filter 1.7s ease;
  }
  .contemplate.out { opacity: 0; filter: blur(4px); }

  .thoughts { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; transition: opacity .8s; }
  .thought-word {
    position: absolute; white-space: nowrap;
    font-family: var(--serif); font-style: italic; color: var(--pale);
    opacity: 0; animation: drift var(--t) linear forwards;
  }
  @keyframes drift {
    0%   { transform: translateX(0); opacity: 0; filter: blur(4px); }
    15%  { opacity: .17; filter: blur(1px); }
    70%  { opacity: .11; }
    100% { transform: translateX(var(--dx)); opacity: 0; filter: blur(8px); }
  }

  .gate { opacity: 0; animation: rise 3s ease 4.8s forwards; width: min(86vw, 26rem); }
  form { display: flex; align-items: center; gap: .6rem; border-bottom: 1px solid rgba(217, 164, 65, .5); transition: border-color .4s; }
  form:focus-within { border-color: var(--gold); }
  input {
    flex: 1; min-width: 0;
    font-family: var(--serif); font-size: 1.5rem; letter-spacing: .12em;
    text-align: center; color: var(--pale);
    background: transparent; border: 0; outline: 0;
    padding: .55rem 0 .5rem 2.6rem; /* balances the arrow so the text stays centred */
  }
  input::placeholder { color: #9a8b69; font-style: italic; letter-spacing: .2em; }
  /* stop the browser painting autofilled passwords light blue */
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--pale); caret-color: var(--pale);
    -webkit-box-shadow: 0 0 0 1000px #050403 inset; box-shadow: 0 0 0 1000px #050403 inset;
    transition: background-color 9999s ease-out 0s;
  }
  .go {
    appearance: none; cursor: pointer; flex: none;
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    background: transparent; color: var(--gold);
    border: 1px solid transparent; font-size: 1.2rem; line-height: 1;
    transition: border-color .3s, box-shadow .3s;
  }
  .go:hover { border-color: var(--gold); box-shadow: 0 0 22px rgba(217, 164, 65, .35); }
  .go:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .msg { min-height: 1.5em; margin-top: .6rem; font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--dim); }
  .shake { animation: shake .5s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .breath { font-size: .68rem; letter-spacing: .4em; text-transform: uppercase; color: var(--dim); min-height: 1em; transition: opacity .8s; }

  .sound {
    position: fixed; z-index: 4; left: 50%; translate: -50% 0; bottom: max(.8rem, env(safe-area-inset-bottom));
    appearance: none; cursor: pointer; background: none; border: 0;
    font: inherit; font-size: .68rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--dim); padding: .5rem .5rem; transition: color .3s;
  }
  .sound:hover { color: var(--gold); }
  .sound:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .sound.pending { color: var(--gold); animation: nudge 3s ease-in-out infinite; }
  @keyframes nudge { 50% { opacity: .4; } }

  /* ---------- When the word is spoken: the wheel slows, stops, and dissolves into the light ---------- */
  body.unlocking #embers { z-index: 6; }
  body.unlocking .spark { display: none; }
  body.unlocking .ring .aura { scale: 2.3; filter: brightness(1.5); }
  body.unlocking .core { scale: 3.2; }
  body.unlocking .gate, body.unlocking .breath, body.unlocking .sound,
  body.unlocking .contemplate, body.unlocking .thoughts, body.unlocking h1,
  body.unlocking .kicker, body.unlocking .launch, body.unlocking .lede { opacity: 0; transition: opacity .8s; pointer-events: none; animation: none; }

  /* ---------- The stage: countdown, the question, the film ---------- */
  .stage {
    position: fixed; inset: 0; z-index: 5; background: #030303;
    opacity: 0; visibility: hidden; transition: opacity 1.4s ease, visibility 0s linear 1.4s;
  }
  .stage.on { opacity: 1; visibility: visible; transition: opacity 1.4s ease; }
  .stage-glow {
    position: absolute; left: 50%; top: 50%; width: min(90vw, 70vh); aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(217, 164, 65, .18), rgba(217, 164, 65, .05) 40%, transparent 65%);
    animation: aurabreath 10s ease-in-out infinite;
  }
  .stage .count, .stage .ready, .stage .video {
    position: absolute; opacity: 0; filter: blur(6px); pointer-events: none;
    transition: opacity .7s ease, filter .9s ease;
  }
  .stage[data-phase="count"] .count, .stage[data-phase="ready"] .ready, .stage[data-phase="video"] .video {
    opacity: 1; filter: none; pointer-events: auto;
  }

  .count { left: 50%; top: 50%; translate: -50% -50%; width: min(62vw, 40vh, 300px); aspect-ratio: 1; }
  .count svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .count-track { fill: none; stroke: rgba(217, 164, 65, .15); stroke-width: 1.5; }
  .count-ring {
    fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 565.5; stroke-dashoffset: 565.5;
    filter: drop-shadow(0 0 6px rgba(217, 164, 65, .7));
  }
  .count-ring.tick { animation: ringdraw 1s linear forwards; }
  @keyframes ringdraw { to { stroke-dashoffset: 0; } }
  #num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 300; font-size: min(30vw, 20vh, 150px); line-height: 1;
    color: var(--pale); text-shadow: 0 0 40px rgba(217, 164, 65, .55);
  }
  #num.tick { animation: numin 1s ease forwards; }
  @keyframes numin {
    0%   { opacity: 0; transform: scale(1.35); filter: blur(10px); }
    25%  { opacity: 1; transform: scale(1);    filter: none; }
    75%  { opacity: 1; }
    100% { opacity: .1; transform: scale(.94); filter: blur(2px); }
  }

  .ready {
    left: 50%; top: 50%; translate: -50% -50%; width: 90vw; text-align: center;
    font-family: var(--serif); font-style: italic; font-weight: 300;
    font-size: clamp(2.2rem, 8vw, 5rem); letter-spacing: .06em;
    color: var(--pale); text-shadow: 0 0 36px rgba(217, 164, 65, .5);
  }

  .video { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; }
  .frame {
    position: relative; overflow: hidden; background: #000;
    width: min(92vw, 960px, calc(70vh * 16 / 9)); aspect-ratio: 16 / 9;
    border: 1px solid rgba(217, 164, 65, .55);
    box-shadow: 0 0 60px rgba(217, 164, 65, .18), inset 0 0 40px rgba(0, 0, 0, .6);
  }
  .frame video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .placeholder {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
    color: var(--dim); font-family: var(--serif); font-style: italic; letter-spacing: .08em;
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
  }
  .placeholder i { width: 0; height: 0; border-left: 22px solid var(--gold); border-top: 13px solid transparent; border-bottom: 13px solid transparent; opacity: .7; }
  .frame.empty .placeholder { display: flex; }

  .skip:hover { color: var(--gold); }
  .skip:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ---------- The finale ---------- */
  .bloom {
    position: fixed; inset: 0; z-index: 8; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, #fff7e0 0%, #f0c46a 22%, #a8651c 50%, #1a0b02 80%);

  }

    opacity: 0; transition: opacity 1.4s ease 1.4s; padding: 1.5rem;
  }
  .bloom small {
    display: block; margin-top: 1rem; font-family: var(--sans); font-weight: 400;
    font-size: .32em; letter-spacing: .4em; text-transform: uppercase;
  }
  body.finale .bloom { clip-path: circle(150% at 50% 50%); transition: clip-path 2.4s cubic-bezier(.5, 0, .2, 1); }
  body.finale .bloom span { opacity: 1; }

  }
  html.calm .ring, html.calm .aura span, html.calm .rays, html.calm .core, html.calm .pulse, html.calm .sound.pending,
  html.calm .shake, html.calm .stage-glow, html.calm .dhamma, html.calm .flame { animation: none; }
  html.calm .fl { animation: appear 0s forwards; }
  html.calm .leaf, html.calm .lantern, html.calm .thoughts { display: none; }
  html.calm h1, html.calm .gate { animation: none; opacity: 1; }

  html.calm .kicker i, html.calm .launch::after, html.calm .beams i, html.calm .halo { animation: none; }
  html.calm .spark { display: none; }

  html.calm #num.tick, html.calm .count-ring.tick { animation: none; }

<script>
(function () {

  var CONFIG = {

    passwordHash: "209e7b0739a70e0b5b572c43ad9fe714975b8156627f5b9a53c56e2d0ffc1ad2",

    // Where visitors go once the gate is open: your real website, and it must be a DIFFERENT page
    // from this gate. If this gate file is your index.html, save your real home page under another
    // name (for example home.html) and write that here: siteUrl: "home.html"
    siteUrl: "home.html",

    // OPTIONAL: "unlock once, open for everyone". Upload unlock.php next to this page
    // and set it here, e.g. "unlock.php". Leave "" to remember only this browser.
    sharedEndpoint: "",

    // Your welcome film. Upload your video next to this page and put its file name here,
    // for example "welcome.mp4" (MP4 with H.264 plays everywhere). Leave "" for now and the
    // empty space is shown for a few seconds instead.
    videoUrl: "",
    videoPoster: "",        // optional still picture shown before the film starts
    placeholderSeconds: 5,  // how long the empty space shows while videoUrl is ""

    // Many computers have "Reduce motion" / "Show animations" switched off, which would freeze the whole
    // page. false = the page always moves (best for a launch). true = obey that setting and stay still.
    respectReducedMotion: false,

    countdownFrom: 10,      // counts down to 1, one number per second
    finalHold: 4.5          // seconds "This is our digital space" stays before entering the website
  };
  /* ============================================== */

  var LOCAL_KEY = "srivipassi-gate-open";
  var SOUND_KEY = "srivipassi-gate-sound";
  var preview = /[?&]preview\b/.test(location.search); // ?preview = test without redirecting
  var reduce = !!(CONFIG.respectReducedMotion && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (reduce) document.documentElement.classList.add("calm");
  var $ = function (id) { return document.getElementById(id); };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // If siteUrl points back at this very page (for example the gate is your index.html and siteUrl is
  // your home address), redirecting would loop forever. Detect that and stay put instead.
  function norm(p) { return p.replace(/\/index\.html?$/i, "/").replace(/\/+$/, "/"); }
  var selfLoop = false;
  try {
    var target = new URL(CONFIG.siteUrl, location.href);
    selfLoop = target.origin === new URL(location.href).origin && norm(target.pathname) === norm(location.pathname);
  } catch (e) {}
  function go() {
    if (selfLoop) {
      var s = document.querySelector(".bloom small");
      if (s) s.textContent = "setup: point siteUrl to your real website page";
      if (window.console) console.warn("Srivipassi gate: siteUrl points to this same page. Set it to your real website page, e.g. home.html");
      return;
    }
    location.replace(CONFIG.siteUrl);
  }

  /* ---------- Already open? Skip the gate ---------- */
  // Add ?reset to the address to forget that this browser already unlocked the gate
  if (/[?&]reset\b/.test(location.search)) { try { localStorage.removeItem(LOCAL_KEY); } catch (e) {} }
  if (!preview && !selfLoop && lsGet(LOCAL_KEY)) { go(); return; }

  if (!preview && !selfLoop && CONFIG.sharedEndpoint) {
    document.documentElement.style.visibility = "hidden";
    var reveal = function () { document.documentElement.style.visibility = ""; };
    fetch(CONFIG.sharedEndpoint, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.unlocked) { go(); } else { reveal(); } })
      .catch(reveal);
  }

  /* ---------- SHA-256 (built-in, with a small fallback) ---------- */
  function sha256Fallback(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var maxWord = Math.pow(2, 32), result = "", words = [], bitLen = ascii.length * 8;
    var hash = [], k = [], pc = 0, comp = {}, i, j;
    for (var c = 2; pc < 64; c++) {
      if (!comp[c]) {
        for (i = 0; i < 313; i += c) comp[i] = c;
        hash[pc] = (Math.pow(c, .5) * maxWord) | 0;
        k[pc++] = (Math.pow(c, 1 / 3) * maxWord) | 0;
      }

          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mx, my); ctx.stroke();
        }
        s = Math.sin(p.t * 1.6);
        ctx.beginPath(); ctx.fillStyle = "rgba(239,227,200," + (.25 + .5 * s * s).toFixed(2) + ")";
        ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      if (!reduce) requestAnimationFrame(frame);
    }
    addEventListener("resize", init); init(); frame();
  })();

  /* ---------- Breath word (10s cycle, matches the light) ---------- */
  (function breath() {
    var el = $("breath"), t0 = Date.now(), last = "";
    if (reduce) { el.textContent = "breathe"; return; }
    setInterval(function () {
      var txt = ((Date.now() - t0) % 10000) < 4000 ? "breathe in" : "let go";
      if (txt !== last) { last = txt; el.style.opacity = 0; setTimeout(function () { el.textContent = txt; el.style.opacity = 1; }, 300); }
    }, 300);
  })();

  /* ---------- Thoughts drift past and dissolve; the light stays ---------- */
  (function thoughts() {
    if (reduce) return;
    var box = $("thoughts");
    var words = ["tomorrow", "worry", "memory", "plans", "regret", "desire", "noise", "doubt", "hurry", "yesterday", "wanting"];
    function spawn() {
      if (document.body.classList.contains("unlocking")) return;
      var s = document.createElement("span"), ltr = Math.random() < .5, t = 24 + Math.random() * 14;
      s.className = "thought-word";
      s.textContent = words[(Math.random() * words.length) | 0];
      s.style.top = (6 + Math.random() * 84) + "%";
      s.style.fontSize = (1 + Math.random() * 1.4) + "rem";
      s.style.letterSpacing = ".12em";
      s.style[ltr ? "left" : "right"] = "-15%";
      s.style.setProperty("--dx", (ltr ? 135 : -135) + "vw");
      s.style.setProperty("--t", t + "s");
      s.addEventListener("animationend", function () { s.remove(); });
      box.appendChild(s);
    }
    setTimeout(function loop() { spawn(); setTimeout(loop, 2600 + Math.random() * 2600); }, 3000);
  })();

  /* ---------- One line of contemplation per breath; each one lights the ring it speaks of ---------- */
  (function contemplate() {
    var el = $("contemplate"), ring = $("ring"), i = 0;
    var lines = [
      { t: "this is saṃsāra, the turning wheel", r: -1 },
      { t: "twelve links hold it together",      r: 0 },
      { t: "six realms, one wheel",              r: 1 },
      { t: "greed, hatred, delusion keep it burning", r: 2 },
      { t: "watch the breath, and it slows",     r: -1 },
      { t: "the centre never moves",             r: 3 },
      { t: "this is nibbāna",                    r: 3 }
    ];
    function show() {
      var L = lines[i % lines.length]; i++;
      el.textContent = L.t; el.classList.remove("out");
      RINGS.forEach(function (R, idx) { R.g.classList.toggle("lit", L.r === idx); });
      ring.classList.toggle("center-lit", L.r === 3);
    }
    if (reduce) { el.textContent = lines[0].t; el.classList.remove("out"); return; }
    setTimeout(function cycle() {
      show();
      setTimeout(function () { el.classList.add("out"); setTimeout(cycle, 1800); }, 8000);
    }, 5600);
  })();

  /* ---------- Zen sound: made live in the browser, no audio file needed ---------- */
  var audio = { ctx: null, master: null, bus: null, on: false, timer: null };
  var NOTES = [146.83, 220, 293.66, 329.63, 392, 440]; // D pentatonic: D3 A3 D4 E4 G4 A4

  function buildAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    var c = audio.ctx = new AC();
    audio.master = c.createGain(); audio.master.gain.value = 0; audio.master.connect(c.destination);
    audio.bus = c.createGain(); audio.bus.connect(audio.master);

    // soft echo, like a quiet hall
    var dly = c.createDelay(2), fb = c.createGain(), lp = c.createBiquadFilter(), wet = c.createGain();
    dly.delayTime.value = .65; fb.gain.value = .45; lp.type = "lowpass"; lp.frequency.value = 1600; wet.gain.value = .55;
    audio.bus.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); lp.connect(wet); wet.connect(audio.master);

    // low drone: D and A, slowly beating
    var droneLp = c.createBiquadFilter(); droneLp.type = "lowpass"; droneLp.frequency.value = 520;
    var droneG = c.createGain(); droneG.gain.value = 1; droneLp.connect(droneG); droneG.connect(audio.bus);
    [[73.42, .11], [110, .07], [146.83, .05], [220.5, .022]].forEach(function (p) {
      [0, .6].forEach(function (d) {
        var o = c.createOscillator(), g = c.createGain();
        o.type = "sine"; o.frequency.value = p[0] + d; g.gain.value = p[1] * (d ? .6 : 1);
        o.connect(g); g.connect(droneLp); o.start();
      });
    });
    var lfo = c.createOscillator(), lfoG = c.createGain();
    lfo.frequency.value = .07; lfoG.gain.value = .3; lfo.connect(lfoG); lfoG.connect(droneG.gain); lfo.start();

    // a breath of air
    var buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    var n = c.createBufferSource(); n.buffer = buf; n.loop = true;
    var bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 480; bp.Q.value = .8;
    var ng = c.createGain(); ng.gain.value = .014;
    var nl = c.createOscillator(), nlg = c.createGain(); nl.frequency.value = .09; nlg.gain.value = .01; nl.connect(nlg); nlg.connect(ng.gain); nl.start();
    n.connect(bp); bp.connect(ng); ng.connect(audio.bus); n.start();
    return true;
  }

  function bowl(f, vel, delay) {
    var c = audio.ctx, t = c.currentTime + (delay || 0);
    [[1, 1, 9], [1.004, .6, 9], [2.76, .38, 6], [5.4, .16, 3.5], [8.9, .06, 2]].forEach(function (p) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f * p[0];
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.16 * vel * p[1], t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + p[2]);
      o.connect(g); g.connect(audio.bus); o.start(t); o.stop(t + p[2] + .2);
    });
  }

  function scheduleBowls(first) {
    clearTimeout(audio.timer);
    audio.timer = setTimeout(function () {
      if (!audio.on) return;
      bowl(NOTES[(Math.random() * NOTES.length) | 0], .55 + Math.random() * .3);
      scheduleBowls(false);
    }, first ? 1500 : 7000 + Math.random() * 6000);
  }

  var soundBtn = $("sound");
  function paintSound() {
    var pending = !audio.on && lsGet(SOUND_KEY) !== "off";
    soundBtn.textContent = audio.on ? "sound on" : (pending ? "tap for sound" : "sound off");
    soundBtn.classList.toggle("pending", pending);
    soundBtn.setAttribute("aria-pressed", audio.on ? "true" : "false");
  }

  function startSound() {
    if (audio.on) return;
    if (!audio.ctx && !buildAudio()) return;
    var c = audio.ctx;
    var begin = function () {
      if (audio.on || c.state !== "running") return;
      var g = audio.master.gain, now = c.currentTime;
      g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(.6, now + 5);
      audio.on = true; paintSound(); scheduleBowls(true);
      GESTURES.forEach(function (n) { removeEventListener(n, firstGesture, true); });
    };
    var p = c.resume();
    if (p && p.then) p.then(begin, function () {}); else begin();
  }
  function stopSound() {
    if (!audio.on) return;
    var g = audio.master.gain, now = audio.ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0, now + 1.2);
    audio.on = false; clearTimeout(audio.timer); paintSound();
  }

  soundBtn.addEventListener("click", function () {
    if (audio.on) { lsSet(SOUND_KEY, "off"); stopSound(); } else { lsSet(SOUND_KEY, "on"); startSound(); }
  });

  // Sound starts by itself. If the browser blocks that, it begins on the first touch, click or key press.
  var GESTURES = ["pointerup", "pointerdown", "touchend", "click", "keydown"];
  function firstGesture(e) {
    if (soundBtn.contains(e.target)) return;
    if (lsGet(SOUND_KEY) === "off") return;
    startSound();
  }
  GESTURES.forEach(function (n) { addEventListener(n, firstGesture, true); });
  if (lsGet(SOUND_KEY) !== "off") startSound(); else paintSound();

  /* ---------- After the word: wheel stills, 10 to 1, "Are you ready?", the film, the welcome ---------- */
  var stage = $("stage"), numEl = $("num"), cring = $("cring"), vid = $("vid"), frame = $("frame");
  var skipBtn = $("skip"), vhint = $("vhint");

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function phase(p) { stage.setAttribute("data-phase", p); }
  function restart(el) { el.classList.remove("tick"); void el.getBoundingClientRect(); el.classList.add("tick"); }

  // a short soft note for each number
  function chime(f, vel) {
    if (!audio.on) return;
    var c = audio.ctx, t = c.currentTime;
    [[1, 1, 2.2], [2, .25, 1.2]].forEach(function (p) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f * p[0];
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.12 * vel * p[1], t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + p[2]);
      o.connect(g); g.connect(audio.bus); o.start(t); o.stop(t + p[2] + .1);
    });
  }
  // lower or restore the zen music (the film brings its own sound)
  function duck(level) {
    if (!audio.on) return;
    var g = audio.master.gain, now = audio.ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(level, now + 1.2);
  }

  function countdown() {
    phase("count");
    var n = CONFIG.countdownFrom;
    return new Promise(function (resolve) {
      (function step() {
        numEl.textContent = n;
        restart(numEl); restart(cring);
        chime(NOTES[n % NOTES.length], n === 1 ? .6 : .25);
        if (n === 1) { setTimeout(resolve, 1000); return; }
        n--; setTimeout(step, 1000);
      })();
    });
  }

  function ready() {
    phase("ready");
    if (audio.on) bowl(293.66, .7, 0);
    return sleep(3400);
  }

  function film() {
    return new Promise(function (resolve) {
      var done = false;
      function finish() { if (done) return; done = true; skipBtn.hidden = true; vhint.hidden = true; resolve(); }
      phase("video");
      skipBtn.onclick = finish;

      if (!CONFIG.videoUrl) {            // no video yet: show the empty space
        frame.classList.add("empty");
        setTimeout(finish, CONFIG.placeholderSeconds * 1000);
        return;
      }
      duck(0);
      vid.addEventListener("ended", finish);
      vid.addEventListener("error", function () { setTimeout(finish, 800); });
      var p = vid.play();
      if (p && p.catch) {
        p.catch(function () {            // some browsers only allow a silent start: play muted, tap for sound
          vid.muted = true; vhint.hidden = false;
          vid.onclick = function () { vid.muted = false; vhint.hidden = true; };
          return vid.play();
        }).catch(function () { setTimeout(finish, 800); });
      }
      setTimeout(function () { if (!done) skipBtn.hidden = false; }, 3000);
    });
  }

  function finale() {
    document.body.classList.add("finale");
    duck(.6);
    if (audio.on) { bowl(73.42, 1, 0); bowl(146.83, .8, .3); bowl(220, .7, .8); bowl(293.66, .7, 1.3); bowl(440, .5, 1.9); }
    if (!preview) setTimeout(go, CONFIG.finalHold * 1000);
  }

  function runSequence() {
    if (CONFIG.videoUrl) { vid.src = CONFIG.videoUrl; if (CONFIG.videoPoster) vid.poster = CONFIG.videoPoster; vid.preload = "auto"; vid.load(); }
    setTimeout(function () { stage.classList.add("on"); }, 2000);   // the wheel has slowed; the dark comes in
    sleep(2900).then(countdown).then(ready).then(film).then(finale);
  }

  /* ---------- The gate ---------- */
  var form = $("gate"), input = $("word"), msg = $("msg"), busy = false;

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var typed = input.value.trim().toLowerCase();

    sha256(typed).then(function (h) {
      if (h === CONFIG.passwordHash) {
        busy = true; msg.textContent = "";
        if (!preview) {
          lsSet(LOCAL_KEY, "1");
          if (CONFIG.sharedEndpoint) {
            try {
              fetch(CONFIG.sharedEndpoint, { method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: typed }), keepalive: true });
            } catch (err) {}
          }
        }
        document.body.classList.add("unlocking");
        runSequence();

        if (reduce) { drawWheel(0, 0, 0); } else { unlockAt = performance.now(); }

        if (lsGet(SOUND_KEY) !== "off") startSound();
        setTimeout(function () {
          if (audio.on) { bowl(146.83, 1, 0); bowl(220, .8, .5); bowl(293.66, .8, 1); bowl(440, .5, 1.7); }
        }, 300);
        setTimeout(function () { if (audio.on) { bowl(73.42, 1, 0); bowl(220, .7, .6); } }, 3300); // the wheel is still
      } else {
        msg.textContent = "not yet. breathe, and try again.";
        form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
        if (audio.on) bowl(110, .35);
        input.select();
      }
    });
  });

  // each key sends one soft wave from the centre of the wheel
  input.addEventListener("input", function () {
    if (reduce) return;
    var p = document.createElement("div"); p.className = "pulse";
    $("ring").appendChild(p);
    p.addEventListener("animationend", function () { p.remove(); });
  });

  input.focus({ preventScroll: true });
})();
</script>
</body>

</html>
